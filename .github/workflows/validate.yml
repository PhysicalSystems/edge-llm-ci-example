name: validate

# Gates pull requests AND re-checks the model on a schedule: benchmark on a real
# edge device and FAIL the check when it regresses past the budget vs the baseline.
# No baseline setup needed — the first run saves it automatically (or pin one via
# a `TINYEDGE_BASELINE` repo variable, see README).

on:
  pull_request:
    paths: ['model.yaml']
  schedule:
    - cron: '0 6 * * *'   # daily: catches new HF revisions of the model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: TinyEdgeAI/tinyedge-actions/validate@v1
        with:
          api-key: ${{ secrets.TINYEDGE_API_KEY }}
          model: "hf:bartowski/Llama-3.2-1B-Instruct-GGUF/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
          baseline: ${{ vars.TINYEDGE_BASELINE }}   # empty = auto (first run saves it)
          device: jetson-orin-nano
          # On the cron, only spend device time when the HF repo actually changed.
          only-on-change: ${{ github.event_name == 'schedule' }}
          max-latency: 220     # from model.yaml budgets — tighten on a branch to see it go red
          tolerance: 10
          # exit 0 = within budget (PR check GREEN), 1 = regression (RED, blocks merge)
